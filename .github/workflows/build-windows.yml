name: Build Windows x64
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          architecture: x64
          cache: maven
      - name: Test, package and verify portable exe
        shell: pwsh
        run: ./build-windows.ps1
      - name: Upload portable Windows package
        uses: actions/upload-artifact@v4
        with:
          name: TenderToolbox-Windows-x64
          path: target/release/*
          if-no-files-found: error
          retention-days: 90
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-verification
          path: |
            target/surefire-reports/
            target/windows/verification/
          retention-days: 30
